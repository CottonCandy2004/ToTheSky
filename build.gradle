plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://api.modrinth.com/maven" } // 生活类模组 (farmersdelight 等)
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create (NeoForge 1.21.1) — 官方建议配置，见 https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // 生活类模组 (1.21.1 NeoForge, Modrinth Maven)
    implementation "maven.modrinth:farmers-delight:${farmersdelight_version}"
    implementation "maven.modrinth:supplementaries:${supplementaries_version}"
    implementation "maven.modrinth:moonlight:${moonlight_version}"      // supplementaries 所需库
    implementation "maven.modrinth:quark:${quark_version}"
    implementation "maven.modrinth:zeta:${zeta_version}"                // quark 所需库
    implementation "maven.modrinth:immersive-weather-renewed:${immersive_weathering_version}"
    implementation "maven.modrinth:kitchen-karrot:${kitchenkarrot_version}"
    implementation "maven.modrinth:kaleidoscope-cookery:${kaleidoscope_cookery_version}"
    implementation "maven.modrinth:my-nethers-delight:${nethersdelight_version}"
    implementation "maven.modrinth:cultural-delights:${culturaldelights_version}"
    implementation "maven.modrinth:crabbers-delight:${crabbersdelight_version}"
    implementation "maven.modrinth:farmers-respite-unofficial-port:${farmersrespite_version}"
    implementation "maven.modrinth:create-confectionery:${create_confectionery_version}"

    // 电力与附魔工业（下界合金/魔女因子链依赖）
    implementation "maven.modrinth:createaddition:${createaddition_version}"
    implementation "maven.modrinth:ae2:${ae2_version}"
    implementation "maven.modrinth:guideme:${guideme_version}"
    // 附魔工业（CEI 2.5.x，硬依赖 create-dragons-plus 1.11.x；Apotheosis 仅为可选联动非硬依赖）
    implementation "maven.modrinth:create-enchantment-industry:${create_enchantment_industry_version}"
    implementation "maven.modrinth:create-dragons-plus:${create_dragons_plus_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
